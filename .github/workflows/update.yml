name: 更新贪婪指数雷达

on:
  # 交易时段每 30min 跑（北京时 09:00–15:30，UTC 01:00–07:30，工作日）
  schedule:
    - cron: "0,30 1-7 * * 1-5"
  # 手动按钮
  workflow_dispatch:

# 并发锁：同一时刻只允许一个 run；新 run 排队等待，绝不重叠（参考 GitHub 提交铁律，防雪崩）
concurrency:
  group: greed-update
  cancel-in-progress: false

permissions:
  pages: write         # 部署到 GitHub Pages
  id-token: write      # OIDC（deploy-pages 所需）

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 检出
        uses: actions/checkout@v4

      - name: 配置 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 安装依赖
        run: pip install -r requirements.txt

      - name: 生成 data.json（取数→筛选→聚合→写盘）
        env:
          ARKVOL_API_KEY: ${{ secrets.ARKVOL_API_KEY }}
        run: python src/main.py

      - name: 上传 Pages 产物（site/ 目录）
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 部署到 GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
